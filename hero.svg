<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Pawan Bhandari - Mobile, Web and Applied AI Engineer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0A0B"/>
      <stop offset="0.6" stop-color="#111010"/>
      <stop offset="1" stop-color="#1A1409"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F0DDB0"/>
      <stop offset="0.5" stop-color="#C9A96E"/>
      <stop offset="1" stop-color="#8E7340"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#C9A96E" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C9A96E" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#C9A96E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>
  <rect width="1200" height="400" fill="url(#glow)"/>

  <!-- left: identity -->
  <g font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace">
    <text x="70" y="110" fill="#C9A96E" font-size="13" letter-spacing="5">PORTFOLIO / 2026</text>
  </g>
  <rect x="70" y="124" width="56" height="2" fill="url(#gold)"/>
  <g font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">
    <text x="70" y="202" fill="#F5F5F4" font-size="68" font-weight="600" letter-spacing="-1.5">Pawan Bhandari</text>
    <text x="72" y="248" fill="#A8A29E" font-size="22" letter-spacing="0.5">Mobile, Web &amp; Applied AI Engineer</text>
  </g>
  <g font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" letter-spacing="2">
    <text x="72" y="310" fill="#C9A96E">FLUTTER</text>
    <text x="168" y="310" fill="#57534E">/</text>
    <text x="188" y="310" fill="#C9A96E">NEXT.JS</text>
    <text x="270" y="310" fill="#57534E">/</text>
    <text x="290" y="310" fill="#C9A96E">NODE.JS</text>
    <text x="372" y="310" fill="#57534E">/</text>
    <text x="392" y="310" fill="#C9A96E">AI</text>
  </g>

