    <!-- phone -->
    <rect x="730" y="80" width="120" height="230" rx="24" stroke-opacity="0.9"/>
    <rect x="770" y="90" width="40" height="6" rx="3" fill="#C9A96E" stroke="none" fill-opacity="0.6"/>
    <rect x="744" y="112" width="92" height="56" rx="10" fill="#C9A96E" fill-opacity="0.12" stroke-opacity="0.5"/>
    <rect x="744" y="180" width="60" height="8" rx="4" fill="#C9A96E" fill-opacity="0.35" stroke="none"/>
    <rect x="744" y="198" width="92" height="8" rx="4" fill="#C9A96E" fill-opacity="0.18" stroke="none"/>
    <rect x="744" y="214" width="76" height="8" rx="4" fill="#C9A96E" fill-opacity="0.18" stroke="none"/>
    <rect x="744" y="262" width="92" height="30" rx="15" fill="#C9A96E" fill-opacity="0.25" stroke="none"/>

    <!-- browser -->
    <rect x="900" y="100" width="230" height="160" rx="12" stroke-opacity="0.9"/>
    <path d="M900 128H1130" stroke-opacity="0.5"/>
    <circle cx="916" cy="114" r="3" fill="#C9A96E" stroke="none"/>
    <circle cx="930" cy="114" r="3" fill="#C9A96E" fill-opacity="0.6" stroke="none"/>
    <circle cx="944" cy="114" r="3" fill="#C9A96E" fill-opacity="0.3" stroke="none"/>
    <rect x="912" y="140" width="40" height="108" rx="6" fill="#C9A96E" fill-opacity="0.1" stroke="none"/>
    <rect x="968" y="206" width="22" height="42" rx="3" fill="#C9A96E" fill-opacity="0.3" stroke="none"/>
    <rect x="998" y="186" width="22" height="62" rx="3" fill="#C9A96E" fill-opacity="0.45" stroke="none"/>
    <rect x="1028" y="160" width="22" height="88" rx="3" fill="#C9A96E" fill-opacity="0.65" stroke="none"/>
    <rect x="1058" y="176" width="22" height="72" rx="3" fill="#C9A96E" fill-opacity="0.4" stroke="none"/>
    <rect x="1088" y="146" width="28" height="102" rx="3" fill="#C9A96E" fill-opacity="0.8" stroke="none"/>

    <!-- connections -->
    <path d="M790 310 C790 350 850 352 874 352" stroke-opacity="0.7" stroke-dasharray="4 8">
      <animate attributeName="stroke-dashoffset" from="0" to="-48" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M1015 260 C1015 352 950 352 926 352" stroke-opacity="0.7" stroke-dasharray="4 8">
      <animate attributeName="stroke-dashoffset" from="0" to="-48" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M926 352 H1068" stroke-opacity="0.7" stroke-dasharray="4 8">
      <animate attributeName="stroke-dashoffset" from="0" to="-48" dur="2.4s" repeatCount="indefinite"/>
    </path>

    <!-- api node -->
    <circle cx="900" cy="352" r="26" fill="#0A0A0B" stroke-opacity="0.95"/>
    <circle cx="900" cy="352" r="8" fill="#C9A96E" stroke="none"/>

    <!-- ai spark -->
    <circle cx="1090" cy="352" r="22" fill="#0A0A0B" stroke-opacity="0.95"/>
    <path d="M1090 338 L1093 349 L1104 352 L1093 355 L1090 366 L1087 355 L1076 352 L1087 349 Z" fill="#C9A96E" stroke="none"/>
