    <text x="1015" y="82">NEXT.JS</text>
    <text x="900" y="392" fill="#C9A96E">NODE API</text>
    <text x="1090" y="392" fill="#C9A96E">AI</text>
  </g>

  <rect x="0" y="397" width="1200" height="3" fill="url(#gold)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
